<ion-header>
  <ion-toolbar>
    <ion-title>Addresses</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngIf="isLoading">
    <ion-card-content>Loading your addresses...</ion-card-content>
  </ion-card>

  <ion-card *ngIf="errorMessage">
    <ion-card-content>{{ errorMessage }}</ion-card-content>
  </ion-card>

  <ion-card *ngIf="!isLoading && addresses.length">
    <ion-card-header>
      <ion-card-title>Saved addresses</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item *ngFor="let address of addresses">
        <ion-label>
          <h3>
            {{ address.label || 'Address' }}
            <ion-badge *ngIf="address.isDefault" color="success">
              Default
            </ion-badge>
          </h3>
          <p>
            {{ address.street }}, {{ address.city }}, {{ address.state }}
          </p>
        </ion-label>
        <ion-button
          *ngIf="!address.isDefault"
          slot="end"
          fill="clear"
          size="small"
          (click)="makeDefault(address)"
        >
          Set default
        </ion-button>
        <ion-button
          slot="end"
          fill="clear"
          size="small"
          color="danger"
          (click)="remove(address)"
        >
          Delete
        </ion-button>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <app-empty-state
    *ngIf="!isLoading && !addresses.length && !errorMessage"
    title="No addresses yet"
    message="Add one so couriers know where to deliver your orders."
  ></app-empty-state>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Add new address</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Label</ion-label>
        <ion-input [(ngModel)]="label" placeholder="Home"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Street</ion-label>
        <ion-input [(ngModel)]="street" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">City</ion-label>
        <ion-input [(ngModel)]="city" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">State</ion-label>
        <ion-input [(ngModel)]="state" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label>Use as default</ion-label>
        <ion-toggle slot="end" [(ngModel)]="isDefault"></ion-toggle>
      </ion-item>
      <ion-button
        class="primary"
        expand="block"
        [disabled]="!canSave || isSaving"
        (click)="save()"
      >
        {{ isSaving ? 'Saving...' : 'Save address' }}
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
