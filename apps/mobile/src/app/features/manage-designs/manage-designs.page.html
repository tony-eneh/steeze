<ion-header>
  <ion-toolbar>
    <ion-title>My designs</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/designer/designs/new">New</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngIf="isLoading">
    <ion-card-content>Loading your designs...</ion-card-content>
  </ion-card>

  <ion-card *ngIf="errorMessage">
    <ion-card-content>{{ errorMessage }}</ion-card-content>
  </ion-card>

  <ion-list *ngIf="!isLoading && designs.length">
    <ion-item-sliding *ngFor="let design of designs">
      <ion-item [routerLink]="['/designer/designs', design.id, 'edit']" detail>
        <ion-thumbnail slot="start" *ngIf="primaryImage(design)">
          <img [src]="primaryImage(design)" [alt]="design.title" />
        </ion-thumbnail>
        <ion-label>
          <h3>
            {{ design.title }}
            <ion-badge [color]="design.isPublished ? 'success' : 'medium'">
              {{ design.isPublished ? 'Published' : 'Draft' }}
            </ion-badge>
          </h3>
          <p>{{ design.category }}</p>
          <p>
            {{ design.currency }} {{ design.basePrice | number: '1.0-0' }}
          </p>
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option (click)="togglePublished(design)">
          {{ design.isPublished ? 'Unpublish' : 'Publish' }}
        </ion-item-option>
        <ion-item-option color="danger" (click)="remove(design)">
          Delete
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <app-empty-state
    *ngIf="!isLoading && !designs.length && !errorMessage"
    title="No designs yet"
    message="Create your first design so customers can order from you."
  ></app-empty-state>

  <div class="ion-padding" *ngIf="!isLoading && !designs.length">
    <ion-button expand="block" routerLink="/designer/designs/new">
      Create a design
    </ion-button>
  </div>
</ion-content>
